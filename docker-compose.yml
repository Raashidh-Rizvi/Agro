
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ML_SERVICE_URL=http://ml-service:8000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/public/uploads
    depends_on:
      - ml-service

  frontend:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
    # Note: Expo web might need more configuration for deep linking/routing in production
    # but for dev mode this works well.

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ml-service/models:/app/models

networks:
  default:
    name: agro-network
